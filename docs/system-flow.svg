<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="740" viewBox="0 0 960 740">
  <defs>
    <marker id="arr-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#7b1fa2"/>
    </marker>
    <marker id="arr-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#1565c0"/>
    </marker>
    <marker id="arr-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#e65100"/>
    </marker>
    <marker id="arr-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#2e7d32"/>
    </marker>
    <marker id="arr-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#607d8b"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="740" fill="#f0f4f8"/>

  <!-- Title bar -->
  <rect width="960" height="58" fill="#1a237e"/>
  <text x="480" y="36" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="bold" fill="white">Arquitetura do Sistema — Weather Dash</text>

  <!-- ───── HTTP CLIENT ───── -->
  <rect x="355" y="80" width="250" height="78" rx="10" fill="white" stroke="#7b1fa2" stroke-width="2" filter="url(#shadow)"/>
  <rect x="355" y="80" width="250" height="30" rx="10" fill="#7b1fa2"/>
  <rect x="355" y="98" width="250" height="12" fill="#7b1fa2"/>
  <text x="480" y="100" text-anchor="middle" font-family="Segoe UI,Arial" font-size="13" font-weight="bold" fill="white">HTTP Client</text>
  <text x="480" y="128" text-anchor="middle" font-family="Segoe UI,Arial" font-size="12" fill="#4a148c">curl  /  Postman  /  Frontend</text>
  <text x="480" y="148" text-anchor="middle" font-family="Segoe UI,Arial" font-size="11" fill="#6a1b9a">POST /lightning/fetch    GET /lightning</text>

  <!-- ↓ request -->
  <line x1="480" y1="158" x2="480" y2="204" stroke="#7b1fa2" stroke-width="2" marker-end="url(#arr-purple)"/>
  <text x="487" y="184" font-family="Segoe UI,Arial" font-size="10" fill="#6a1b9a">request</text>

  <!-- ↑ response (right side detour) -->
  <polyline points="660,278 700,278 700,119 606,119" fill="none" stroke="#607d8b" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-gray)"/>
  <text x="706" y="200" font-family="Segoe UI,Arial" font-size="10" fill="#546e7a">JSON</text>
  <text x="706" y="214" font-family="Segoe UI,Arial" font-size="10" fill="#546e7a">Response</text>

  <!-- ───── NESTJS CONTAINER ───── -->
  <rect x="100" y="210" width="760" height="316" rx="14" fill="#e3f2fd" stroke="#1565c0" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="126" y="232" font-family="Segoe UI,Arial" font-size="12" font-weight="bold" fill="#1565c0">NestJS Application  (src/lightning/)</text>

  <!-- LightningController box -->
  <rect x="240" y="244" width="480" height="100" rx="8" fill="white" stroke="#1976d2" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="240" y="244" width="480" height="30" rx="8" fill="#1976d2"/>
  <rect x="240" y="262" width="480" height="12" fill="#1976d2"/>
  <text x="480" y="264" text-anchor="middle" font-family="Segoe UI,Arial" font-size="13" font-weight="bold" fill="white">LightningController</text>
  <text x="360" y="294" text-anchor="middle" font-family="Courier New,monospace" font-size="11" fill="#0d47a1">@Post('fetch')</text>
  <text x="600" y="294" text-anchor="middle" font-family="Courier New,monospace" font-size="11" fill="#0d47a1">@Get()</text>
  <text x="360" y="312" text-anchor="middle" font-family="Segoe UI,Arial" font-size="10" fill="#546e7a">Dispara coleta na API externa</text>
  <text x="600" y="312" text-anchor="middle" font-family="Segoe UI,Arial" font-size="10" fill="#546e7a">Aceita query: data, bbox lat/lon</text>
  <text x="360" y="328" text-anchor="middle" font-family="Segoe UI,Arial" font-size="10" fill="#546e7a">Retorna { fetched, stored }</text>
  <text x="600" y="328" text-anchor="middle" font-family="Segoe UI,Arial" font-size="10" fill="#546e7a">Retorna LightningStrike[]</text>
  <line x1="480" y1="250" x2="480" y2="340" stroke="#bbdefb" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- ↓ controller → service -->
  <line x1="480" y1="344" x2="480" y2="384" stroke="#1565c0" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- LightningService box -->
  <rect x="170" y="386" width="620" height="116" rx="8" fill="white" stroke="#0d47a1" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="170" y="386" width="620" height="30" rx="8" fill="#0d47a1"/>
  <rect x="170" y="404" width="620" height="12" fill="#0d47a1"/>
  <text x="480" y="406" text-anchor="middle" font-family="Segoe UI,Arial" font-size="13" font-weight="bold" fill="white">LightningService</text>
  <!-- Left method -->
  <text x="345" y="434" text-anchor="middle" font-family="Courier New,monospace" font-size="11" fill="#0d47a1">fetchAndStore()</text>
  <text x="345" y="452" text-anchor="middle" font-family="Segoe UI,Arial" font-size="10" fill="#555">• Itera 15 pontos de monitoramento</text>
  <text x="345" y="468" text-anchor="middle" font-family="Segoe UI,Arial" font-size="10" fill="#555">• Filtra códigos 200–232 (trovoada)</text>
  <text x="345" y="484" text-anchor="middle" font-family="Segoe UI,Arial" font-size="10" fill="#555">• Mapeia código → intensidade (kA)</text>
  <!-- Divider -->
  <line x1="480" y1="416" x2="480" y2="494" stroke="#c5cae9" stroke-width="1" stroke-dasharray="3,2"/>
  <!-- Right method -->
  <text x="615" y="434" text-anchor="middle" font-family="Courier New,monospace" font-size="11" fill="#0d47a1">findAll(query)</text>
  <text x="615" y="452" text-anchor="middle" font-family="Segoe UI,Arial" font-size="10" fill="#555">• Filtra por startDate / endDate</text>
  <text x="615" y="468" text-anchor="middle" font-family="Segoe UI,Arial" font-size="10" fill="#555">• Filtra por bounding box</text>
  <text x="615" y="484" text-anchor="middle" font-family="Segoe UI,Arial" font-size="10" fill="#555">• Ordena por occurrenceDate DESC</text>

  <!-- ───── EXTERNAL: OWM ───── -->
  <!-- Arrow: service left-bottom → OWM top -->
  <line x1="260" y1="490" x2="150" y2="582" stroke="#e65100" stroke-width="2" marker-end="url(#arr-orange)"/>
  <!-- Arrow: OWM → service (dashed return) -->
  <line x1="162" y1="590" x2="272" y2="500" stroke="#e65100" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-orange)"/>
  <!-- Labels -->
  <text x="164" y="536" font-family="Segoe UI,Arial" font-size="10" fill="#e65100" transform="rotate(-35,164,536)">GET weather</text>
  <text x="186" y="564" font-family="Segoe UI,Arial" font-size="10" fill="#e65100" transform="rotate(-35,186,564)">JSON data</text>

  <rect x="22" y="582" width="228" height="134" rx="10" fill="white" stroke="#f57c00" stroke-width="2" filter="url(#shadow)"/>
  <rect x="22" y="582" width="228" height="32" rx="10" fill="#f57c00"/>
  <rect x="22" y="602" width="228" height="12" fill="#f57c00"/>
  <text x="136" y="604" text-anchor="middle" font-family="Segoe UI,Arial" font-size="13" font-weight="bold" fill="white">OpenWeatherMap</text>
  <text x="136" y="638" text-anchor="middle" font-family="Segoe UI,Arial" font-size="11" font-weight="bold" fill="#e65100">API Externa</text>
  <text x="136" y="658" text-anchor="middle" font-family="Courier New,monospace" font-size="10" fill="#555">GET /data/2.5/weather</text>
  <text x="136" y="675" text-anchor="middle" font-family="Segoe UI,Arial" font-size="10" fill="#555">15 pontos BR (capitais + regiões)</text>
  <text x="136" y="692" text-anchor="middle" font-family="Segoe UI,Arial" font-size="10" fill="#e65100">⚡ Código 2xx = trovoada</text>
  <text x="136" y="708" text-anchor="middle" font-family="Segoe UI,Arial" font-size="10" fill="#555">Chave: OPENWEATHER_API_KEY</text>

  <!-- ───── EXTERNAL: MYSQL ───── -->
  <!-- Arrow: service right-bottom → MySQL top -->
  <line x1="700" y1="490" x2="810" y2="582" stroke="#2e7d32" stroke-width="2" marker-end="url(#arr-green)"/>
  <!-- Arrow: MySQL → service (dashed return) -->
  <line x1="798" y1="590" x2="688" y2="500" stroke="#2e7d32" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-green)"/>
  <!-- Labels -->
  <text x="726" y="534" font-family="Segoe UI,Arial" font-size="10" fill="#2e7d32" transform="rotate(35,726,534)">INSERT/SELECT</text>
  <text x="748" y="562" font-family="Segoe UI,Arial" font-size="10" fill="#2e7d32" transform="rotate(35,748,562)">Entity rows</text>

  <rect x="710" y="582" width="228" height="134" rx="10" fill="white" stroke="#388e3c" stroke-width="2" filter="url(#shadow)"/>
  <rect x="710" y="582" width="228" height="32" rx="10" fill="#388e3c"/>
  <rect x="710" y="602" width="228" height="12" fill="#388e3c"/>
  <text x="824" y="604" text-anchor="middle" font-family="Segoe UI,Arial" font-size="13" font-weight="bold" fill="white">MySQL Database</text>
  <text x="824" y="638" text-anchor="middle" font-family="Courier New,monospace" font-size="12" font-weight="bold" fill="#1b5e20">lightning_strikes</text>
  <text x="824" y="658" text-anchor="middle" font-family="Segoe UI,Arial" font-size="11" fill="#555">TypeORM  (synchronize: true)</text>
  <text x="824" y="676" text-anchor="middle" font-family="Segoe UI,Arial" font-size="10" fill="#555">repo.save()  |  repo.find()</text>
  <text x="824" y="694" text-anchor="middle" font-family="Segoe UI,Arial" font-size="10" fill="#2e7d32">INDEX occurrenceDate</text>
  <text x="824" y="710" text-anchor="middle" font-family="Segoe UI,Arial" font-size="10" fill="#2e7d32">INDEX latitude, longitude</text>

  <!-- ───── LEGEND ───── -->
  <rect x="330" y="610" width="300" height="100" rx="8" fill="white" stroke="#cfd8dc" stroke-width="1" opacity="0.9"/>
  <text x="480" y="630" text-anchor="middle" font-family="Segoe UI,Arial" font-size="11" font-weight="bold" fill="#37474f">Legenda</text>
  <line x1="350" y1="648" x2="390" y2="648" stroke="#7b1fa2" stroke-width="2" marker-end="url(#arr-purple)"/>
  <text x="396" y="652" font-family="Segoe UI,Arial" font-size="10" fill="#333">Requisição HTTP</text>
  <line x1="350" y1="666" x2="390" y2="666" stroke="#1565c0" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="396" y="670" font-family="Segoe UI,Arial" font-size="10" fill="#333">Chamada interna (sync)</text>
  <line x1="350" y1="684" x2="390" y2="684" stroke="#e65100" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arr-orange)"/>
  <text x="396" y="688" font-family="Segoe UI,Arial" font-size="10" fill="#333">API externa / retorno</text>
  <line x1="470" y1="648" x2="510" y2="648" stroke="#2e7d32" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arr-green)"/>
  <text x="516" y="652" font-family="Segoe UI,Arial" font-size="10" fill="#333">SQL / retorno DB</text>
  <line x1="470" y1="666" x2="510" y2="666" stroke="#607d8b" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-gray)"/>
  <text x="516" y="670" font-family="Segoe UI,Arial" font-size="10" fill="#333">Resposta ao cliente</text>
</svg>
